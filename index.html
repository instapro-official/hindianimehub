<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Hindi Ghar - Watch Anime in Hindi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-left">
            <h1 class="logo">Anime<span>HindiGhar</span></h1>
        </div>
        <div class="nav-right">
            <button id="adminBtn" class="admin-btn"><i class="fa-solid fa-lock"></i> Admin</button>
        </div>
    </header>

    <!-- Search Bar Section -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Anime search karein (e.g., Naruto, One Piece)...">
        <i class="fa-solid fa-search"></i>
    </div>

    <!-- Hero / Featured Section -->
    <section class="hero" id="heroSection">
        <div class="hero-content">
            <span class="badge">HINDI DUBBED</span>
            <h2 class="hero-title" id="heroTitle">WELCOME TO ANIME HINDI GHAR</h2>
            <p class="hero-tags" id="heroTags">Dub | Sub • Action, Adventure, Shonen</p>
            <p class="hero-desc" id="heroDesc">
                Yahan aapko sabhi latest anime Hindi dub aur sub mein milenge. Neeche scroll karein aur anime ki list explore karein!
            </p>
        </div>
    </section>

    <!-- Anime List Section -->
    <main class="main-container">
        <h3 class="section-title">All Anime List</h3>
        <div class="anime-grid" id="animeGrid">
            <!-- Dynamic Anime Cards -->
        </div>
    </main>

    <!-- Admin Panel Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2>Admin Panel - Add Anime</h2>
            <form id="animeForm">
                <label>Anime Title:</label>
                <input type="text" id="animeTitleInput" required placeholder="Jaise: Naruto Shippuden">
                
                <label>Episode Details (Jaise: Episode 1 / Ep 5):</label>
                <input type="text" id="animeEpisodeInput" required placeholder="Episode 1">
                
                <label>Category / Genres (Dub | Sub):</label>
                <input type="text" id="animeCategoryInput" required placeholder="Action, Hindi Dub">
                
                <label>Gallery se Photo Select Karein (Permanent):</label>
                <input type="file" id="animeImageInput" accept="image/*" required>
                
                <label>Catbox Video Link (.mp4 direct link):</label>
                <input type="url" id="animeVideoInput" required placeholder="https://files.catbox.moe/xxxxxx.mp4">
                
                <button type="submit" class="btn-submit">Upload Anime</button>
            </form>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div id="videoModal" class="modal">
        <div class="video-modal-content">
            <span class="close-btn" id="closeVideoModal">&times;</span>
            <h2 id="modalAnimeTitle" style="margin-bottom: 5px; font-size: 18px;"></h2>
            <p id="modalEpisodeInfo" style="color: #f47521; font-size: 13px; margin-bottom: 10px;"></p>
            <video id="animeVideoPlayer" controls style="width:100%; max-height:400px; background:#000;"></video>
        </div>
    </div>

    <!-- Bottom Mobile Navigation Bar -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" onclick="document.getElementById('searchInput').focus(); return false;">
            <i class="fa-solid fa-search"></i>
            <span>Search</span>
        </a>
        <a href="#" class="nav-item" onclick="document.getElementById('adminBtn').click(); return false;">
            <i class="fa-solid fa-upload"></i>
            <span>Admin Add</span>
        </a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
