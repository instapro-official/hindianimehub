<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeFlix India - Watch Anime in Hindi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding-bottom: 70px;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
        }

        .logo span {
            color: #f47521;
        }

        /* Search Bar */
        .search-container {
            padding: 15px 20px;
            background: #181818;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-container input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            background-color: #2a2a2a;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 14px;
        }

        .search-container i {
            position: absolute;
            left: 32px;
            color: #888;
        }

        /* Hero Section */
        .hero {
            height: 300px;
            background: linear-gradient(to top, #121212, rgba(18, 18, 18, 0.4)), 
                        url('https://images.unsplash.com/photo-1578632767115-351597cf2477?w=1000') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .hero-content {
            max-width: 600px;
        }

        .badge {
            background-color: #f47521;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 3px;
        }

        .hero-title {
            font-size: 22px;
            font-weight: 900;
            margin: 8px 0;
        }

        .hero-tags {
            font-size: 12px;
            color: #d0d0d0;
            margin-bottom: 8px;
        }

        .hero-desc {
            font-size: 12px;
            color: #b8b8b8;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Main Container & Grid */
        .main-container {
            padding: 20px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
            border-left: 4px solid #f47521;
            padding-left: 8px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .anime-card {
            background-color: #1a1a1a;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .anime-card:hover {
            transform: scale(1.03);
        }

        .card-img {
            position: relative;
        }

        .card-img img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .episode-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.85);
            color: #f47521;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #f47521;
        }

        .card-info {
            padding: 8px;
        }

        .card-info h4 {
            font-size: 13px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-info p {
            font-size: 11px;
            color: #888;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }

        .modal-content, .video-modal-content, .episodes-modal-content {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }

        .close-btn:hover {
            color: #fff;
        }

        #animeForm label {
            display: block;
            margin-top: 10px;
            font-size: 13px;
            color: #ccc;
        }

        #animeForm input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }

        .btn-submit {
            margin-top: 15px;
            width: 100%;
            background-color: #f47521;
            color: white;
            padding: 10px;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .episodes-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }

        .episode-btn {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 10px 15px;
            border-radius: 5px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .episode-btn:hover {
            background: #f47521;
            border-color: #f47521;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #181818;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #282828;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #888;
            font-size: 10px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: #f47521;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-left">
            <h1 class="logo" id="siteLogo">Anime<span>Flix</span> India</h1>
        </div>
    </header>

    <!-- Search Bar Section -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Anime search karein (e.g., Naruto, One Piece)...">
        <i class="fa-solid fa-search"></i>
    </div>

    <!-- Hero Section -->
    <section class="hero" id="heroSection">
        <div class="hero-content">
            <span class="badge">HINDI DUBBED</span>
            <h2 class="hero-title" id="heroTitle">WELCOME TO ANIMEFLIX INDIA</h2>
            <p class="hero-tags" id="heroTags">Dub | Sub • Action, Adventure, Shonen</p>
            <p class="hero-desc" id="heroDesc">
                Yahan aapko sabhi latest anime Hindi dub aur sub mein milenge. Neeche scroll karein aur anime ki list explore karein!
            </p>
        </div>
    </section>

    <!-- Anime List Section -->
    <main class="main-container">
        <h3 class="section-title">All Anime List</h3>
        <div class="anime-grid" id="animeGrid">
            <div style="color: #aaa; grid-column: 1/-1; text-align: center; padding: 40px;">Loading Anime...</div>
        </div>
    </main>

    <!-- Admin Panel Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2>Admin Panel - Auto Sync</h2>
            <form id="animeForm">
                <label>GitHub Username:</label>
                <input type="text" id="ghUser" required placeholder="Aapka GitHub Username">
                
                <label>Repository Name:</label>
                <input type="text" id="ghRepo" required placeholder="Aapka Repo Name (jaise hindianimehub)">
                
                <label>GitHub Personal Access Token (Token sirf pehli baar dalna hoga):</label>
                <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">

                <hr style="border-color:#444; margin: 15px 0;">

                <label>Anime Title:</label>
                <input type="text" id="animeTitleInput" required placeholder="Jaise: 7th time loop">
                
                <label>Episode Name/Number:</label>
                <input type="text" id="animeEpisodeInput" required placeholder="Episode 2">
                
                <label>Category / Genres:</label>
                <input type="text" id="animeCategoryInput" required placeholder="Hindi Sub">
                
                <label>Gallery se Photo Select Karein:</label>
                <input type="file" id="animeImageInput" accept="image/*">
                
                <label>Catbox Video Link (.mp4 direct link):</label>
                <input type="url" id="animeVideoInput" required placeholder="https://files.catbox.moe/xxxxxx.mp4">
                
                <button type="submit" class="btn-submit">Direct Upload to GitHub</button>
            </form>
        </div>
    </div>

    <!-- Episodes List Modal -->
    <div id="episodesModal" class="modal">
        <div class="episodes-modal-content">
            <span class="close-btn" id="closeEpisodesModal">&times;</span>
            <h2 id="epModalTitle" style="font-size: 18px; margin-bottom: 5px;"></h2>
            <p id="epModalCategory" style="color: #f47521; font-size: 13px; margin-bottom: 10px;"></p>
            <div class="episodes-list" id="episodesListContainer"></div>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div id="videoModal" class="modal">
        <div class="video-modal-content">
            <span class="close-btn" id="closeVideoModal">&times;</span>
            <h2 id="modalAnimeTitle" style="margin-bottom: 5px; font-size: 18px;"></h2>
            <p id="modalEpisodeInfo" style="color: #f47521; font-size: 13px; margin-bottom: 10px;"></p>
            <video id="animeVideoPlayer" controls style="width:100%; max-height:400px; background:#000;"></video>
        </div>
    </div>

    <!-- Bottom Mobile Navigation Bar -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" onclick="document.getElementById('searchInput').focus(); return false;">
            <i class="fa-solid fa-search"></i>
            <span>Search</span>
        </a>
    </nav>

    <!-- JavaScript with GitHub API Integration -->
    <script>
        let isAdmin = localStorage.getItem("is_admin") === "true";
        let savedAnime = [];

        // Auto-fill stored GitHub credentials if available
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('gh_user')) document.getElementById('ghUser').value = localStorage.getItem('gh_user');
            if(localStorage.getItem('gh_repo')) document.getElementById('ghRepo').value = localStorage.getItem('gh_repo');
            if(localStorage.getItem('gh_token')) document.getElementById('ghToken').value = localStorage.getItem('gh_token');
        });

        const animeGrid = document.getElementById('animeGrid');
        const searchInput = document.getElementById('searchInput');
        const adminModal = document.getElementById('adminModal');
        const closeModal = document.getElementById('closeModal');
        const animeForm = document.getElementById('animeForm');
        const siteLogo = document.getElementById('siteLogo');

        const episodesModal = document.getElementById('episodesModal');
        const closeEpisodesModal = document.getElementById('closeEpisodesModal');
        const epModalTitle = document.getElementById('epModalTitle');
        const epModalCategory = document.getElementById('epModalCategory');
        const episodesListContainer = document.getElementById('episodesListContainer');

        const videoModal = document.getElementById('videoModal');
        const closeVideoModal = document.getElementById('closeVideoModal');
        const animeVideoPlayer = document.getElementById('animeVideoPlayer');
        const modalAnimeTitle = document.getElementById('modalAnimeTitle');
        const modalEpisodeInfo = document.getElementById('modalEpisodeInfo');

        async function fetchAnime() {
            try {
                const response = await fetch('anime.json?t=' + new Date().getTime());
                if (response.ok) {
                    let rawData = await response.json();
                    savedAnime = convertToGrouped(rawData);
                } else {
                    savedAnime = [];
                }
                renderAnime(savedAnime);
            } catch (error) {
                console.error('Error fetching anime:', error);
                savedAnime = [];
                renderAnime(savedAnime);
            }
        }

        function convertToGrouped(data) {
            let map = {};
            data.forEach(item => {
                if (item.episodes) {
                    map[item.title] = item;
                } else {
                    if (!map[item.title]) {
                        map[item.title] = {
                            title: item.title,
                            category: item.category,
                            image: item.image,
                            episodes: []
                        };
                    }
                    map[item.title].episodes.push({
                        episode: item.episode,
                        videoUrl: item.videoUrl
                    });
                }
            });
            return Object.values(map);
        }

        function renderAnime(list) {
            animeGrid.innerHTML = "";
            if (list.length === 0) {
                animeGrid.innerHTML = "<div style='color: #aaa; grid-column: 1/-1; text-align: center; padding: 40px; font-size: 16px;'>Koi anime nahi mila!</div>";
                return;
            }
            
            list.forEach((anime) => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                
                let totalEpisodes = anime.episodes ? anime.episodes.length : 0;
                
                card.innerHTML = `
                    <div class="card-img">
                        <img src="${anime.image}" alt="${anime.title}">
                        <span class="episode-badge">${totalEpisodes} Episodes</span>
                    </div>
                    <div class="card-info">
                        <h4>${anime.title}</h4>
                        <p>${anime.category}</p>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    epModalTitle.innerText = anime.title;
                    epModalCategory.innerText = anime.category;
                    episodesListContainer.innerHTML = "";
                    
                    if (anime.episodes && anime.episodes.length > 0) {
                        anime.episodes.forEach(ep => {
                            const epBtn = document.createElement('button');
                            epBtn.className = 'episode-btn';
                            epBtn.innerHTML = `<span><i class="fa-solid fa-play" style="margin-right:8px; color:#f47521;"></i> ${ep.episode}</span> <i class="fa-solid fa-chevron-right" style="font-size:11px; color:#888;"></i>`;
                            
                            epBtn.addEventListener('click', () => {
                                episodesModal.style.display = 'none';
                                modalAnimeTitle.innerText = anime.title;
                                modalEpisodeInfo.innerText = ep.episode + " • " + anime.category;
                                animeVideoPlayer.src = ep.videoUrl;
                                videoModal.style.display = 'flex';
                                animeVideoPlayer.play();
                            });
                            
                            episodesListContainer.appendChild(epBtn);
                        });
                    } else {
                        episodesListContainer.innerHTML = "<p style='color:#888; text-align:center;'>Koi episode uplabdh nahi hai.</p>";
                    }
                    
                    episodesModal.style.display = 'flex';
                });
                
                animeGrid.appendChild(card);
            });
        }

        fetchAnime();

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            if (term === "") {
                renderAnime(savedAnime);
                return;
            }
            const filtered = savedAnime.filter(a => 
                a.title.toLowerCase().includes(term) || 
                a.category.toLowerCase().includes(term)
            );
            renderAnime(filtered);
        });

        // Secret 5-Tap Trick on Logo
        let titleClickCount = 0;
        if (siteLogo) {
            siteLogo.addEventListener('click', () => {
                titleClickCount++;
                if (titleClickCount >= 5) {
                    titleClickCount = 0;
                    if (!isAdmin) {
                        let pass = prompt("Admin Password daaliye:");
                        if (pass === "admin123") {
                            localStorage.setItem("is_admin", "true");
                            isAdmin = true;
                            alert("Admin Login Successful!");
                            adminModal.style.display = 'flex';
                        } else if (pass !== null) {
                            alert("Galat Password!");
                        }
                    } else {
                        adminModal.style.display = 'flex';
                    }
                }
            });
        }

        closeModal.addEventListener('click', () => { adminModal.style.display = 'none'; });
        closeEpisodesModal.addEventListener('click', () => { episodesModal.style.display = 'none'; });
        closeVideoModal.addEventListener('click', () => {
            videoModal.style.display = 'none';
            animeVideoPlayer.pause();
            animeVideoPlayer.src = "";
        });

        // Form Submit & GitHub Direct API Commit
        animeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdmin) return;

            const username = document.getElementById('ghUser').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();

            // Save credentials in browser
            localStorage.setItem('gh_user', username);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            const title = document.getElementById('animeTitleInput').value.trim();
            const episode = document.getElementById('animeEpisodeInput').value.trim();
            const category = document.getElementById('animeCategoryInput').value.trim();
            const videoUrl = document.getElementById('animeVideoInput').value.trim();
            const imageFile = document.getElementById('animeImageInput').files[0];

            async function processUpload(imageUrl) {
                // Fetch current anime.json from GitHub to get latest SHA and data
                let sha = "";
                let currentList = [];
                try {
                    const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/anime.json`, {
                        headers: { "Authorization": `token ${token}` }
                    });
                    if (res.ok) {
                        const fileData = await res.json();
                        sha = fileData.sha;
                        currentList = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
                    }
                } catch(err) {
                    console.log("Creating new anime.json or fetching error");
                }

                let groupedList = convertToGrouped(currentList);
                let existingAnime = groupedList.find(a => a.title.toLowerCase() === title.toLowerCase());

                if (existingAnime) {
                    existingAnime.episodes.push({ episode: episode, videoUrl: videoUrl });
                    if (category) existingAnime.category = category;
                    if (imageUrl) existingAnime.image = imageUrl;
                } else {
                    const newAnime = {
                        title: title,
                        category: category,
                        image: imageUrl || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500',
                        episodes: [{ episode: episode, videoUrl: videoUrl }]
                    };
                    groupedList.unshift(newAnime);
                }

                // Push back to GitHub via API
                const jsonContent = btoa(unescape(encodeURIComponent(JSON.stringify(groupedList, null, 2))));
                
                const updateRes = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/anime.json`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: `Add ${title} - ${episode}`,
                        content: jsonContent,
                        sha: sha ? sha : undefined
                    })
                });

                if (updateRes.ok) {
                    alert("Success! Episode seedha GitHub par update ho gaya hai. 1-2 minute mein website par live ho jayega!");
                    adminModal.style.display = 'none';
                    animeForm.reset();
                    fetchAnime();
                } else {
                    alert("Error: GitHub par update nahi ho paya. Token ya Username/Repo check karein.");
                }
            }

            if (imageFile) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    const img = new Image();
                    img.src = uploadEvent.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 300;
                        const MAX_HEIGHT = 450;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        processUpload(compressedBase64);
                    };
                };
                reader.readAsDataURL(imageFile);
            } else {
                let existingAnime = savedAnime.find(a => a.title.toLowerCase() === title.toLowerCase());
                let existingImage = existingAnime ? existingAnime.image : '';
                processUpload(existingImage);
            }
        });
    </script>
</body>
</html>
